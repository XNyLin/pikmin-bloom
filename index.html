<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202124">
<title>Pikmin Bloom圖鑑</title>
<style>
:root{--card:#fff;--text:#202124;--muted:#777;--line:#dedede;--shadow:0 6px 18px rgba(0,0,0,.06);--red:#e34b42;--yellow:#d9a400;--blue:#2680c2;--purple:#7b4bc4;--white:#8b8b8b;--pink:#df5a9b;--rock:#6f6862;--ice:#42aeb8;--progress-low:#d85c52;--progress-mid:#d99a20;--progress-high:#3d9b68}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff 0,#f1f1f1 260px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC","PingFang TC",sans-serif}
main{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 56px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
h1{margin:6px 0 4px;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;line-height:1}
.sub{margin:0;color:var(--muted);font-size:13px}
.dashboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;grid-template-areas:"label count" "bar percent";gap:4px 10px;align-items:center}
.stat-label{grid-area:label;font-size:12px;color:var(--muted);font-weight:800}.stat-count{grid-area:count;font-size:18px;font-weight:950;white-space:nowrap}.stat-percent{grid-area:percent;font-size:11px;color:var(--muted);white-space:nowrap}
.bar{grid-area:bar;height:5px;background:#e4e4e4;border-radius:999px;overflow:hidden}.bar>div{height:100%;border-radius:inherit}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:16px 0 8px}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;outline:none}.search:focus{border-color:#777;box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.reset{border:1px solid var(--line);background:#fff;color:#333;border-radius:10px;padding:0 12px;font-weight:800;cursor:pointer}
.filters{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.filter{border:1px solid var(--line);background:#fff;color:#555;padding:7px 11px;border-radius:9px;font-weight:850;cursor:pointer;white-space:nowrap}.filter.active{background:#202124;color:#fff;border-color:#202124}
.list{display:grid;gap:10px}.category{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.category-toggle{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:0;background:none;padding:0;color:inherit;text-align:left;font:inherit;cursor:pointer}
.category-title{font-size:18px;font-weight:950}.category-meta{margin-top:3px;color:var(--muted);font-size:12px}.rare-note{color:#ff2d55;font-weight:400}
.badge{padding:5px 8px;border-radius:999px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}
.series-list{display:grid;gap:8px;margin-top:10px}.category.collapsed .series-list{display:none}
.series{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fafafa}.series.rare{background:#f2f2f2;border-color:#cfcfcf}
.series-row{display:flex;align-items:center;gap:10px}.series-head{display:flex;flex:0 0 150px;justify-content:space-between;gap:8px;align-items:center}.series-name{font-size:14px;font-weight:900}.series-count{font-size:12px;color:var(--muted);font-weight:850;white-space:nowrap}
.pikmin-grid{display:flex;flex:1;flex-wrap:wrap;gap:6px}.pick{position:relative;flex:1 1 76px;min-width:70px}.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label{display:flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:5px 7px;border:1px solid #d6d6d6;border-radius:8px;background:#fff;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}.pick label:before{content:"";width:14px;height:14px;flex:0 0 14px;border:2px solid #bdbdbd;border-radius:4px;background:#fff}
.color-r label{color:var(--red)}.color-y label{color:var(--yellow)}.color-b label{color:var(--blue)}.color-u label{color:var(--purple)}.color-w label{color:var(--white)}.color-p label{color:var(--pink)}.color-k label{color:var(--rock)}.color-i label{color:var(--ice)}
.pick input:checked+label{background:#f3f3f3}.pick input:checked+label:before{content:"✓";display:grid;place-items:center;color:#fff;font-size:10px}
.color-r input:checked+label,.color-r input:checked+label:before{border-color:var(--red)}.color-r input:checked+label:before{background:var(--red)}
.color-y input:checked+label,.color-y input:checked+label:before{border-color:var(--yellow)}.color-y input:checked+label:before{background:var(--yellow)}
.color-b input:checked+label,.color-b input:checked+label:before{border-color:var(--blue)}.color-b input:checked+label:before{background:var(--blue)}
.color-u input:checked+label,.color-u input:checked+label:before{border-color:var(--purple)}.color-u input:checked+label:before{background:var(--purple)}
.color-w input:checked+label,.color-w input:checked+label:before{border-color:var(--white)}.color-w input:checked+label:before{background:var(--white)}
.color-p input:checked+label,.color-p input:checked+label:before{border-color:var(--pink)}.color-p input:checked+label:before{background:var(--pink)}
.color-k input:checked+label,.color-k input:checked+label:before{border-color:var(--rock)}.color-k input:checked+label:before{background:var(--rock)}
.color-i input:checked+label,.color-i input:checked+label:before{border-color:var(--ice)}.color-i input:checked+label:before{background:var(--ice)}
.series-bar{height:4px;background:#e4e4e4;border-radius:999px;overflow:hidden;margin-top:7px}.series-bar>div{height:100%;background:#333}.series.rare .series-bar>div{background:#666}
.empty{text-align:center;color:var(--muted);padding:30px 0}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#202124;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.dashboard{grid-template-columns:1fr;gap:6px}.toolbar{grid-template-columns:1fr}.reset{height:40px}main{width:min(100% - 18px,900px);padding-top:18px}.series-row{align-items:flex-start;flex-wrap:wrap}.series-head{flex:1 0 100%}.pick{flex-basis:92px}}
</style>
</head>
<body>
<main><div class="eyebrow">Pikmin Bloom Collection</div><h1>Pikmin Bloom圖鑑</h1><p class="sub">Version 1.0.0</p><section class="dashboard" id="dashboard"></section><div class="toolbar"><input id="search" class="search" type="search" placeholder="搜尋類別、裝飾系列或皮克敏顏色"><button id="reset" class="reset">全部重設</button></div><div class="filters" id="filters"></div><section class="list" id="list"></section><div class="footer">最後更新：<span id="updatedAt">—</span></div></main><div class="toast" id="toast">已儲存</div>
<script>
const C={r:'紅',y:'黃',b:'藍',w:'白',u:'紫',p:'粉',k:'岩',i:'冰'},seven=['r','y','b','w','u','p','k'],eight=['r','y','b','u','w','p','k','i'];
const items=codes=>codes.map((code,index,arr)=>({id:`${code}-${index+1}`,label:arr.filter(x=>x===code).length>1?`${C[code]} ${arr.slice(0,index+1).filter(x=>x===code).length}`:C[code]}));
const S=(name,codes,rare=false)=>({name,rare,items:items(codes)});
const data=[
{group:'regular',icon:'🍽️',name:'餐廳',series:[S('廚師帽',eight),S('廚師帽（稀有）',seven,true)]},
{group:'regular',icon:'☕',name:'咖啡廳',series:[S('咖啡杯',eight),S('稀有咖啡杯',eight,true)]},
{group:'regular',icon:'🍰',name:'甜點店',series:[S('馬卡龍',seven),S('甜甜圈',seven)]},
{group:'regular',icon:'🎬',name:'電影院',series:[S('爆米花',seven)]},
{group:'regular',icon:'💊',name:'藥局',series:[S('牙刷',seven),S('牙刷（稀有）',seven,true)]},
{group:'regular',icon:'🦁',name:'動物園',series:[S('蒲公英',seven)]},
{group:'regular',icon:'🌲',name:'森林',series:[S('鍬形蟲',eight),S('橡栗',eight)]},
{group:'regular',icon:'🌊',name:'水邊',series:[S('擬餌',seven),S('擬餌（稀有）',seven,true)]},
{group:'regular',icon:'📮',name:'郵局',series:[S('郵票',seven)]},
{group:'regular',icon:'🖼️',name:'美術館',series:[S('畫框',seven)]},
{group:'regular',icon:'✈️',name:'機場',series:[S('飛機玩具',seven)]},
{group:'regular',icon:'🚉',name:'車站',series:[S('電車紙模型',seven),S('票券',seven),S('票券（稀有）',seven,true)]},
{group:'regular',icon:'🏖️',name:'海灘',series:[S('貝殼',seven)]},
{group:'regular',icon:'🍔',name:'漢堡店',series:[S('漢堡',seven)]},
{group:'regular',icon:'🏪',name:'便利店',series:[S('瓶蓋',seven),S('零食',seven)]},
{group:'regular',icon:'🛒',name:'超市',series:[S('蘑菇',seven),S('香蕉',seven),S('香蕉（稀有）',seven,true)]},
{group:'regular',icon:'🥖',name:'麵包店',series:[S('法國麵包',eight),S('法國麵包（稀有）',seven,true)]},
{group:'regular',icon:'💇',name:'美容院',series:[S('剪刀',seven),S('剪刀（稀有）',seven,true)]},
{group:'regular',icon:'👕',name:'服裝店',series:[S('髮圈',seven)]},
{group:'regular',icon:'🌳',name:'公園',series:[S('幸運草',eight),S('四葉幸運草',eight,true)]},
{group:'regular',icon:'📚',name:'圖書館',series:[S('迷你書',seven)]},
{group:'regular',icon:'🛣️',name:'路邊',series:[S('綠貼紙',eight),S('藍貼紙',eight),S('橙貼紙',eight),S('金幣',eight),S('金幣（稀有）',eight,true)]},
{group:'regular',icon:'🍣',name:'壽司餐廳',series:[S('壽司',seven)]},
{group:'regular',icon:'⛰️',name:'山丘',series:[S('山丘別針徽章',seven)]},
{group:'regular',icon:'🏟️',name:'體育館',series:[S('體育館鑰匙圈',seven),S('體育館鑰匙圈（稀有）',seven,true)]},
{group:'regular',icon:'🌧️',name:'雨天',series:[S('葉子帽',['b','b','b'])]},
{group:'regular',icon:'❄️',name:'下雪',series:[S('雪',['w','w','w'])]},
{group:'regular',icon:'🎡',name:'主題樂園',series:[S('主題樂園門票',['r','r','y','y','b','b'])]},
{group:'regular',icon:'🚏',name:'公車站',series:[S('公車紙模型',seven)]},
{group:'regular',icon:'🍝',name:'義式餐廳',series:[S('披薩',seven),S('義大利麵',seven)]},
{group:'regular',icon:'🍜',name:'拉麵店',series:[S('拉麵鑰匙圈',seven)]},
{group:'regular',icon:'🌉',name:'橋樑',series:[S('橋樑別針',seven)]},
{group:'regular',icon:'🏨',name:'飯店',series:[S('飯店備品',seven)]},
{group:'regular',icon:'💄',name:'化妝品商店',series:[S('化妝品',seven)]},
{group:'regular',icon:'⛩️',name:'神社和寺廟',series:[S('運勢（吉）',seven)]},
{group:'regular',icon:'🔌',name:'電器行',series:[S('電池',['y','y','y','y','y','y']),S('仙女燈',['y','y'])]},
{group:'regular',icon:'🍛',name:'咖哩餐廳',series:[S('一碗咖哩',seven)]},
{group:'regular',icon:'🔨',name:'五金行',series:[S('工具',seven)]},
{group:'regular',icon:'🎓',name:'大學&學院',series:[S('校徽別針',['r','y','b'])]},
{group:'regular',icon:'🌮',name:'墨西哥餐廳',series:[S('塔可餅',seven)]},
{group:'regular',icon:'🧺',name:'自助洗衣店&乾洗店',series:[S('洗衣用品',seven)]},
{group:'regular',icon:'🥘',name:'韓國餐廳',series:[S('韓國泡菜',eight)]},
{group:'regular',icon:'✏️',name:'文具店',series:[S('文具',eight)]},
{group:'limited',icon:'🍄',name:'超級瑪利歐鑰匙圈',series:[S('超級瑪利歐鑰匙圈',['r','y','b','u'])]},
{group:'limited',icon:'🧧',name:'農曆新年飾品：金色',series:[S('農曆新年飾品：金色',seven)]},
{group:'limited',icon:'🧤',name:'連指手套',series:[S('連指手套',seven)]},
{group:'limited',icon:'👓',name:'2024眼鏡',series:[S('2024眼鏡',seven)]},
{group:'limited',icon:'💌',name:'逆轉情人節貼紙',series:[S('逆轉情人節貼紙',seven)]},
{group:'limited',icon:'🎁',name:'禮物貼紙（金色）',series:[S('禮物貼紙（金色）',seven)]},
{group:'limited',icon:'🥚',name:'兔寶寶彩蛋',series:[S('兔寶寶彩蛋',seven)]},
{group:'limited',icon:'🍦',name:'冰淇淋：經典',series:[S('冰淇淋：經典',seven)]},
{group:'limited',icon:'🧩',name:'拼圖：2023夏日回憶',series:[S('拼圖：2023夏日回憶',seven)]},
{group:'limited',icon:'🔮',name:'裝飾球',series:[S('裝飾球',seven)]},
{group:'limited',icon:'🎉',name:'2025派對拉炮',series:[S('2025派對拉炮',seven)]},
{group:'limited',icon:'🍫',name:'巧克力',series:[S('巧克力',seven)]},
{group:'limited',icon:'🫖',name:'下午茶',series:[S('下午茶',seven)]},
{group:'limited',icon:'🎮',name:'Nintendo遊戲機 1980-1995',series:[S('Nintendo遊戲機 1980-1995',seven)]},
{group:'limited',icon:'🎺',name:'迷你樂器：銅管樂團',series:[S('迷你樂器：銅管樂團',seven)]},
{group:'limited',icon:'🏄',name:'衝浪板鑰匙圈',series:[S('衝浪板鑰匙圈',seven)]},
{group:'limited',icon:'📷',name:'照片鈕扣徽章',series:[S('照片鈕扣徽章',['r'])]},
{group:'limited',icon:'✨',name:'2025裝飾',series:[S('2025裝飾',eight)]},
{group:'limited',icon:'🍼',name:'奶嘴',series:[S('奶嘴',['r'])]},
{group:'limited',icon:'🍱',name:'日式年菜',series:[S('日式年菜',eight)]},
{group:'limited',icon:'🍫',name:'2026巧克力',series:[S('2026巧克力',eight)]},
{group:'limited',icon:'🎨',name:'彩色粉末',series:[S('彩色粉末',eight)]},
{group:'limited',icon:'👞',name:'荷蘭木鞋鑰匙圈',series:[S('荷蘭木鞋鑰匙圈',eight)]},
{group:'limited',icon:'🕹️',name:'遊戲卡匣',series:[S('遊戲卡匣',eight)]},
{group:'limited',icon:'🌼',name:'花冠',series:[S('花冠',eight)]},
{group:'limited',icon:'🎻',name:'迷你樂器：管弦樂團',series:[S('迷你樂器：管弦樂團',eight)]}
];
const slug=s=>Array.from(s).map(c=>c.codePointAt(0).toString(16)).join('-');
data.forEach(c=>{c.id='c-'+slug(c.name);c.series.forEach((s,n)=>{s.id=`${c.id}-s${n+1}`})});
const KEY='pikmin-bloom-collection-v5';let state=load(),filter='all',query='',expanded=new Set();
function blank(){const o={};data.forEach(c=>c.series.forEach(s=>s.items.forEach(i=>o[`${s.id}-${i.id}`]=false)));return o}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.checked)return v}catch(e){}const checked=blank();try{const old=JSON.parse(localStorage.getItem('pikmin-bloom-collection-v4'));if(old?.items){data.forEach(c=>{const ov=old.items[c.id];if(!ov)return;c.series.forEach((s,si)=>s.items.forEach(i=>{const color=i.id.split('-')[0],source=si===0?ov.types:ov.rareTypes;if(source&&source[color]!==undefined)checked[`${s.id}-${i.id}`]=Boolean(source[color])}))})}}catch(e){}return{checked,updatedAt:Date.now()}}
function save(){state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));renderDashboard();document.getElementById('updatedAt').textContent=new Date(state.updatedAt).toLocaleString('zh-TW');toast()}
const counts=group=>{let total=0,done=0;data.filter(c=>!group||c.group===group).forEach(c=>c.series.forEach(s=>s.items.forEach(i=>{total++;if(state.checked[`${s.id}-${i.id}`])done++})));return{done,total,p:total?Math.round(done/total*100):0}};
const progressColor=p=>p<40?'var(--progress-low)':p<70?'var(--progress-mid)':'var(--progress-high)';
function renderDashboard(){const all=counts(),reg=counts('regular'),lim=counts('limited');document.getElementById('dashboard').innerHTML=[['全部 Decor',all],['一般 Decor',reg],['期間限定',lim]].map(([name,x])=>`<article class="stat"><div class="stat-label">${name}</div><div class="stat-count">${x.done} / ${x.total}</div><div class="stat-percent">${x.p}%</div><div class="bar"><div style="width:${x.p}%;background:${progressColor(x.p)}"></div></div></article>`).join('')}
function doneOfSeries(s){return s.items.filter(i=>state.checked[`${s.id}-${i.id}`]).length}
function doneOfCategory(c){return c.series.reduce((n,s)=>n+doneOfSeries(s),0)}
function totalOfCategory(c){return c.series.reduce((n,s)=>n+s.items.length,0)}
function regularComplete(c){const normal=c.series.filter(s=>!s.rare);return normal.every(s=>doneOfSeries(s)===s.items.length)}
function match(c){const text=[c.name,...c.series.map(s=>s.name),...c.series.flatMap(s=>s.items.map(i=>i.label))].join(' ').toLowerCase();if(query&&!text.includes(query))return false;const d=doneOfCategory(c),t=totalOfCategory(c);if(filter==='regular'&&c.group!=='regular')return false;if(filter==='limited'&&c.group!=='limited')return false;if(filter==='rare'&&!c.series.some(s=>s.rare))return false;if(filter==='unfinished'&&d===t)return false;if(filter==='done'&&d!==t)return false;return true}
function render(){
 const list=document.getElementById('list'),visible=data.filter(match);
 list.innerHTML=visible.map(c=>{
  const d=doneOfCategory(c),t=totalOfCategory(c),p=t?Math.round(d/t*100):0,rareSeries=c.series.filter(s=>s.rare),normalSeries=c.series.filter(s=>!s.rare),shownSeries=regularComplete(c)?c.series:normalSeries,meta=c.group==='limited'?'期間限定':`${normalSeries.length} 種飾品${rareSeries.length?`・<span class="rare-note">${rareSeries.length} 種稀有飾品</span>`:''}`,isOpen=expanded.has(c.id);
  return `<article class="category ${isOpen?'':'collapsed'}" data-category="${c.id}"><button class="category-toggle" type="button" data-toggle="${c.id}" aria-expanded="${isOpen}"><div><div class="category-title">${c.icon} ${c.name}</div><div class="category-meta">${meta}</div></div><span class="badge" style="background:${progressColor(p)}">${d===t?'已完成':`${d} / ${t}`}</span></button><div class="series-list">${shownSeries.map(s=>{const sd=doneOfSeries(s),st=s.items.length,limited=c.group==='limited';return `<section class="series ${s.rare?'rare':''}"><div class="series-row">${limited?'':`<div class="series-head"><div class="series-name">${s.name}</div><div class="series-count">${sd} / ${st}</div></div>`}<div class="pikmin-grid">${s.items.map(i=>{const key=`${s.id}-${i.id}`,color=i.id.split('-')[0];return `<div class="pick color-${color}"><input type="checkbox" id="${key}" data-key="${key}" ${state.checked[key]?'checked':''}><label for="${key}">${i.label}</label></div>`}).join('')}</div></div><div class="series-bar"><div style="width:${st?sd/st*100:0}%"></div></div></section>`}).join('')}</div></article>`
 }).join('')||'<div class="empty">找不到符合條件的裝飾系列。</div>';
 list.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.toggle;expanded.has(id)?expanded.delete(id):expanded.add(id);render()}));
 list.querySelectorAll('input[data-key]').forEach(el=>el.addEventListener('change',e=>{state.checked[e.target.dataset.key]=e.target.checked;save();render()}))
}
function renderFilters(){const defs=[['all','全部'],['unfinished','未完成'],['done','已完成'],['regular','一般 Decor'],['limited','期間限定'],['rare','稀有 Decor']];document.getElementById('filters').innerHTML=defs.map(([id,label])=>`<button class="filter ${filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();render()})}
function toast(){const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),900)}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
document.getElementById('reset').onclick=()=>{if(confirm('確定要清除所有圖鑑進度？')){state={checked:blank(),updatedAt:Date.now()};save();render()}};
renderDashboard();renderFilters();render();document.getElementById('updatedAt').textContent=new Date(state.updatedAt).toLocaleString('zh-TW');
</script>
</body>
</html>
