<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6c945">
<title>Pikmin Bloom 圖鑑進度</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#1f2328;--muted:#73777d;--line:#e7e7e2;--accent:#f6c945;--done:#2f9e67;--shadow:0 14px 38px rgba(31,35,40,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC","PingFang TC",sans-serif;background:linear-gradient(180deg,#fff7d8 0,#f7f7f4 260px);color:var(--text)}main{width:min(760px,calc(100% - 32px));margin:auto;padding:42px 0 60px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#8b6a00;text-transform:uppercase}h1{margin:10px 0 8px;font-size:clamp(30px,7vw,52px);line-height:1.04;letter-spacing:-.04em}.sub{margin:0;color:var(--muted);font-size:16px}.summary{margin-top:28px;background:rgba(255,255,255,.84);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.summary-row{display:flex;justify-content:space-between;align-items:end;gap:16px}.count{font-size:42px;font-weight:900;letter-spacing:-.04em}.percent{font-size:15px;color:var(--muted);font-weight:700}.bar{height:14px;background:#ecece7;border-radius:999px;overflow:hidden;margin-top:16px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffdc69);border-radius:inherit;transition:width .35s}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 12px}.section-title h2{margin:0;font-size:18px}button{font:inherit}.ghost{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer}.ghost:hover{background:#ecece7;color:var(--text)}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto;padding-bottom:2px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--muted);padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:var(--text);color:#fff;border-color:var(--text)}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 6px 18px rgba(31,35,40,.035);transition:.2s}.item:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(31,35,40,.07)}.check{appearance:none;width:26px;height:26px;border:2px solid #c7c7c1;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:.2s}.check:checked{background:var(--done);border-color:var(--done)}.check:checked:after{content:"✓";color:#fff;font-size:17px;font-weight:900}.label{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:3px}.item.done .label{text-decoration:line-through;color:#8a8d91}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#f1f1ed;color:#74777c;white-space:nowrap}.item.done .badge{background:#e5f5ec;color:#267c51}.note{width:100%;margin-top:8px;border:0;border-top:1px solid var(--line);padding:10px 0 0;font:inherit;color:var(--text);outline:none;background:transparent;grid-column:2/4;resize:vertical;min-height:34px}footer{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#202124;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){main{width:min(100% - 20px,760px);padding-top:26px}.summary{border-radius:20px}.item{grid-template-columns:auto 1fr}.badge{grid-column:2;justify-self:start}.note{grid-column:2}.count{font-size:34px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">Pikmin Bloom Collection</div>
<h1>Pikmin Bloom 圖鑑進度</h1>
<p class="sub">記錄一般類別與期間限定類別的收集進度；資料會自動保存在這台裝置。</p>
<section class="summary"><div class="summary-row"><div><div class="count"><span id="doneCount">0</span> / <span id="totalCount">0</span></div><div class="percent" id="summaryText">尚未開始</div></div><div class="percent" id="percentText">0%</div></div><div class="bar"><div id="progressBar"></div></div></section>
<div class="section-title"><h2>圖鑑類別</h2><button class="ghost" id="resetBtn">全部重設</button></div>
<div class="tabs"><button class="tab active" data-tab="regular">一般類別 <span id="regularCount"></span></button><button class="tab" data-tab="limited">期間限定 <span id="limitedCount"></span></button></div>
<section class="list" id="list"></section>
<footer>最後更新：<span id="updatedAt">—</span></footer>
</main><div class="toast" id="toast">已儲存</div>
<script>
const regular=['餐廳','咖啡廳','甜點店','電影院','藥局','動物園','森林','水邊','郵局','美術館','機場','車站','海灘','漢堡店','便利店','超市','麵包店','美容院','服裝店','公園','圖書館','路邊','壽司餐廳','山丘','體育館','雨天','下雪','主題樂園','公車站','義式餐廳','拉麵店','橋樑','飯店','化妝品商店','神社和寺廟','電器行','咖哩餐廳','五金行','大學&學院','墨西哥餐廳','自助洗衣店&乾洗店','韓國餐廳','文具店'];
const limited=['超級瑪利歐鑰匙圈','農曆新年飾品：金色','連指手套','2024眼鏡','逆轉情人節貼紙','禮物貼紙（金色）','兔寶寶彩蛋','冰淇淋：經典','拼圖：2023夏日回憶','裝飾球','2025派對拉炮','巧克力','下午茶','Nintendo遊戲機 1980-1995','迷你樂器：銅管樂團','衝浪板鑰匙圈','照片鈕扣徽章','2025裝飾','奶嘴','日式年菜','2026巧克力','彩色粉末','荷蘭木鞋鑰匙圈','遊戲卡匣','花冠','迷你樂器：管弦樂團'];
const icons=['🍽️','☕','🍰','🎬','💊','🦁','🌲','🌊','📮','🖼️','✈️','🚉','🏖️','🍔','🏪','🛒','🥖','💇','👕','🌳','📚','🛣️','🍣','⛰️','🏟️','🌧️','❄️','🎡','🚏','🍝','🍜','🌉','🏨','💄','⛩️','🔌','🍛','🔨','🎓','🌮','🧺','🥘','✏️'];
const limitedIcons=['🍄','🧧','🧤','👓','💌','🎁','🥚','🍦','🧩','🔮','🎉','🍫','🫖','🎮','🎺','🏄','📷','✨','🍼','🍱','🍫','🎨','👞','🕹️','🌼','🎻'];
const slug=s=>'c-'+Array.from(s).map(x=>x.codePointAt(0).toString(16)).join('-');
const categories=[...regular.map((name,i)=>({id:slug(name),group:'regular',name,icon:icons[i]})),...limited.map((name,i)=>({id:slug(name),group:'limited',name,icon:limitedIcons[i]}))];
const initialDone=['餐廳','咖啡廳','水邊','路邊'].map(slug);const key='pikmin-bloom-collection-v2';let activeTab='regular';let state=load();
function load(){try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.items){categories.forEach(c=>saved.items[c.id]??={done:false,note:''});return saved}}catch(e){}const items={};categories.forEach(c=>items[c.id]={done:initialDone.includes(c.id),note:''});return{items,updatedAt:Date.now()}}
function save(){state.updatedAt=Date.now();localStorage.setItem(key,JSON.stringify(state));updateSummary();showToast()}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const list=document.getElementById('list');list.innerHTML='';categories.filter(c=>c.group===activeTab).forEach(c=>{const v=state.items[c.id]||{done:false,note:''};const el=document.createElement('article');el.className='item'+(v.done?' done':'');el.innerHTML=`<input class="check" type="checkbox" aria-label="${c.name}" ${v.done?'checked':''}><div><div class="label">${c.icon} ${c.name}</div><div class="meta">${c.group==='limited'?'期間限定類別':'一般地點類別'}</div></div><span class="badge">${v.done?'已收集':'未收集'}</span><textarea class="note" rows="1" placeholder="備註日期、數量或來源…">${esc(v.note||'')}</textarea>`;const cb=el.querySelector('.check'),note=el.querySelector('.note');cb.onchange=()=>{state.items[c.id].done=cb.checked;render();save()};note.oninput=()=>{state.items[c.id].note=note.value;saveSoon()};list.appendChild(el)});updateSummary()}
function updateSummary(){const done=categories.filter(c=>state.items[c.id]?.done).length,pct=Math.round(done/categories.length*100),r=categories.filter(c=>c.group==='regular'),l=categories.filter(c=>c.group==='limited'),rd=r.filter(c=>state.items[c.id]?.done).length,ld=l.filter(c=>state.items[c.id]?.done).length;doneCount.textContent=done;totalCount.textContent=categories.length;percentText.textContent=pct+'%';progressBar.style.width=pct+'%';summaryText.textContent=done===categories.length?'全部完成':`還剩 ${categories.length-done} 類`;regularCount.textContent=`(${rd}/${r.length})`;limitedCount.textContent=`(${ld}/${l.length})`;updatedAt.textContent=new Date(state.updatedAt).toLocaleString('zh-TW',{dateStyle:'medium',timeStyle:'short'})}
let timer;function saveSoon(){clearTimeout(timer);timer=setTimeout(save,350)}function showToast(){toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),1000)}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));render()});resetBtn.onclick=()=>{if(!confirm('確定要清除所有勾選與備註嗎？'))return;categories.forEach(c=>state.items[c.id]={done:false,note:''});render();save()};render();
</script>
</body></html>
