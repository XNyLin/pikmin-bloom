<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6c945">
<title>Pikmin Bloom 圖鑑進度</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#1f2328;--muted:#73777d;--line:#e7e7e2;--accent:#f6c945;--done:#2f9e67;--rare:#8c5bd6;--shadow:0 14px 38px rgba(31,35,40,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC","PingFang TC",sans-serif;background:linear-gradient(180deg,#fff7d8 0,#f7f7f4 260px);color:var(--text)}main{width:min(920px,calc(100% - 32px));margin:auto;padding:42px 0 60px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#8b6a00;text-transform:uppercase}h1{margin:10px 0 8px;font-size:clamp(30px,7vw,52px);line-height:1.04;letter-spacing:-.04em}.sub{margin:0;color:var(--muted);font-size:16px}.summary{margin-top:28px;background:rgba(255,255,255,.84);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.summary-row{display:flex;justify-content:space-between;align-items:end;gap:16px}.count{font-size:42px;font-weight:900;letter-spacing:-.04em}.percent{font-size:15px;color:var(--muted);font-weight:700}.bar{height:14px;background:#ecece7;border-radius:999px;overflow:hidden;margin-top:16px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffdc69);border-radius:inherit;transition:width .35s}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 12px}.section-title h2{margin:0;font-size:18px}button{font:inherit}.ghost{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer}.ghost:hover{background:#ecece7;color:var(--text)}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto;padding-bottom:2px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--muted);padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:var(--text);color:#fff;border-color:var(--text)}.list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(31,35,40,.035)}.item-head,.rare-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.label{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:3px}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#f1f1ed;color:#74777c;white-space:nowrap}.item.done>.item-head .badge{background:#e5f5ec;color:#267c51}.pikmin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.pikmin-option{position:relative}.pikmin-option input{position:absolute;opacity:0;pointer-events:none}.pikmin-option label{display:flex;align-items:center;gap:8px;min-height:42px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fafaf8;font-size:14px;font-weight:750;cursor:pointer;transition:.18s}.pikmin-option label:before{content:"";width:18px;height:18px;flex:0 0 18px;border:2px solid #c7c7c1;border-radius:6px;background:#fff}.pikmin-option input:checked+label{border-color:#9dd4b7;background:#edf8f2;color:#226a46}.pikmin-option input:checked+label:before{content:"✓";display:grid;place-items:center;background:var(--done);border-color:var(--done);color:#fff;font-size:12px;font-weight:900}.category-progress{height:7px;background:#efefeb;border-radius:999px;overflow:hidden;margin-top:12px}.category-progress>div{height:100%;background:var(--done);border-radius:inherit}.category-count{margin-top:6px;text-align:right;color:var(--muted);font-size:12px;font-weight:700}.rare-section{margin-top:16px;padding:14px;border-radius:14px;background:#f8f4ff;border:1px solid #e3d8f7}.rare-title{font-size:15px;font-weight:900;color:#62409d}.rare-section .badge{background:#eee5fb;color:#68459f}.rare-section .pikmin-option input:checked+label{border-color:#c8afe9;background:#f2ebfb;color:#5d3c91}.rare-section .pikmin-option input:checked+label:before{background:var(--rare);border-color:var(--rare)}.rare-section .category-progress>div{background:var(--rare)}.rare-locked{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f5f5f2;color:var(--muted);font-size:13px;font-weight:700}.rare-note{font-size:12px;color:var(--muted);margin-top:4px}footer{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#202124;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){main{width:min(100% - 20px,920px);padding-top:26px}.summary{border-radius:20px}.pikmin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.count{font-size:34px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">Pikmin Bloom Collection</div>
<h1>Pikmin Bloom 圖鑑進度</h1>
<p class="sub">每個類別可分別記錄 8 種皮克敏；指定類別完成一般收集後，會解鎖稀有裝飾進度。</p>
<section class="summary"><div class="summary-row"><div><div class="count"><span id="doneCount">0</span> / <span id="totalCount">0</span></div><div class="percent" id="summaryText">尚未開始</div></div><div class="percent" id="percentText">0%</div></div><div class="bar"><div id="progressBar"></div></div></section>
<div class="section-title"><h2>圖鑑類別</h2><button class="ghost" id="resetBtn">全部重設</button></div>
<div class="tabs"><button class="tab active" data-tab="regular">一般類別 <span id="regularCount"></span></button><button class="tab" data-tab="limited">期間限定 <span id="limitedCount"></span></button></div>
<section class="list" id="list"></section>
<footer>最後更新：<span id="updatedAt">—</span></footer>
</main><div class="toast" id="toast">已儲存</div>
<script>
const regular=['餐廳','咖啡廳','甜點店','電影院','藥局','動物園','森林','水邊','郵局','美術館','機場','車站','海灘','漢堡店','便利店','超市','麵包店','美容院','服裝店','公園','圖書館','路邊','壽司餐廳','山丘','體育館','雨天','下雪','主題樂園','公車站','義式餐廳','拉麵店','橋樑','飯店','化妝品商店','神社和寺廟','電器行','咖哩餐廳','五金行','大學&學院','墨西哥餐廳','自助洗衣店&乾洗店','韓國餐廳','文具店'];
const limited=['超級瑪利歐鑰匙圈','農曆新年飾品：金色','連指手套','2024眼鏡','逆轉情人節貼紙','禮物貼紙（金色）','兔寶寶彩蛋','冰淇淋：經典','拼圖：2023夏日回憶','裝飾球','2025派對拉炮','巧克力','下午茶','Nintendo遊戲機 1980-1995','迷你樂器：銅管樂團','衝浪板鑰匙圈','照片鈕扣徽章','2025裝飾','奶嘴','日式年菜','2026巧克力','彩色粉末','荷蘭木鞋鑰匙圈','遊戲卡匣','花冠','迷你樂器：管弦樂團'];
const icons=['🍽️','☕','🍰','🎬','💊','🦁','🌲','🌊','📮','🖼️','✈️','🚉','🏖️','🍔','🏪','🛒','🥖','💇','👕','🌳','📚','🛣️','🍣','⛰️','🏟️','🌧️','❄️','🎡','🚏','🍝','🍜','🌉','🏨','💄','⛩️','🔌','🍛','🔨','🎓','🌮','🧺','🥘','✏️'];
const limitedIcons=['🍄','🧧','🧤','👓','💌','🎁','🥚','🍦','🧩','🔮','🎉','🍫','🫖','🎮','🎺','🏄','📷','✨','🍼','🍱','🍫','🎨','👞','🕹️','🌼','🎻'];
const pikminTypes=[['red','紅皮'],['yellow','黃皮'],['blue','藍皮'],['white','白皮'],['winged','粉皮'],['purple','紫皮'],['rock','岩皮'],['ice','冰皮']];
const rareLabels={'餐廳':'稀有裝飾','咖啡廳':'稀有裝飾','藥局':'稀有裝飾','超市':'香蕉','麵包店':'稀有裝飾','美容院':'稀有裝飾','路邊':'金幣','公園':'稀有裝飾','水邊':'稀有裝飾','體育館':'稀有裝飾'};
const slug=s=>'c-'+Array.from(s).map(x=>x.codePointAt(0).toString(16)).join('-');
const categories=[...regular.map((name,i)=>({id:slug(name),group:'regular',name,icon:icons[i]})),...limited.map((name,i)=>({id:slug(name),group:'limited',name,icon:limitedIcons[i]}))];
const initialDone=['餐廳','咖啡廳','水邊','路邊'].map(slug);const key='pikmin-bloom-collection-v4';let activeTab='regular';let state=load();
function blankTypes(value=false){return Object.fromEntries(pikminTypes.map(([id])=>[id,value]))}
function load(){try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.items){categories.forEach(c=>{saved.items[c.id]??={types:blankTypes(),rareTypes:blankTypes()};saved.items[c.id].types??=blankTypes();saved.items[c.id].rareTypes??=blankTypes()});return saved}}catch(e){}let old=null;try{old=JSON.parse(localStorage.getItem('pikmin-bloom-collection-v3'))}catch(e){}const items={};categories.forEach(c=>{const types=old?.items?.[c.id]?.types||blankTypes(initialDone.includes(c.id));items[c.id]={types,rareTypes:blankTypes()}});return{items,updatedAt:Date.now()}}
function save(){state.updatedAt=Date.now();localStorage.setItem(key,JSON.stringify(state));updateSummary();showToast()}
function checks(c,v,rare=false){const source=rare?v.rareTypes:v.types;return `<div class="pikmin-grid">${pikminTypes.map(([id,name])=>`<div class="pikmin-option"><input id="${c.id}-${rare?'rare-':''}${id}" type="checkbox" data-type="${id}" data-rare="${rare}" ${source[id]?'checked':''}><label for="${c.id}-${rare?'rare-':''}${id}">${name}</label></div>`).join('')}</div>`}
function render(){const list=document.getElementById('list');list.innerHTML='';categories.filter(c=>c.group===activeTab).forEach(c=>{const v=state.items[c.id]||{types:blankTypes(),rareTypes:blankTypes()};const completed=pikminTypes.filter(([id])=>v.types[id]).length;const rareEligible=Boolean(rareLabels[c.name]);const rareCompleted=pikminTypes.filter(([id])=>v.rareTypes[id]).length;const unlocked=completed===8;const el=document.createElement('article');el.className='item'+(completed===8?' done':'');el.innerHTML=`<div class="item-head"><div><div class="label">${c.icon} ${c.name}</div><div class="meta">${c.group==='limited'?'期間限定類別':'一般地點類別'}</div></div><span class="badge">${completed===8?'已完成':completed+'/8'}</span></div>${checks(c,v)}<div class="category-progress"><div style="width:${completed/8*100}%"></div></div><div class="category-count">一般 ${completed} / 8</div>${rareEligible?(unlocked?`<section class="rare-section"><div class="rare-head"><div><div class="rare-title">✨ 稀有：${rareLabels[c.name]}</div><div class="rare-note">一般皮克敏 8/8 完成後解鎖</div></div><span class="badge">${rareCompleted===8?'已完成':rareCompleted+'/8'}</span></div>${checks(c,v,true)}<div class="category-progress"><div style="width:${rareCompleted/8*100}%"></div></div><div class="category-count">稀有 ${rareCompleted} / 8</div></section>`:`<div class="rare-locked">🔒 一般皮克敏完成 8/8 後解鎖稀有進度</div>`):''}`;el.querySelectorAll('input[data-type]').forEach(cb=>cb.onchange=()=>{const target=cb.dataset.rare==='true'?'rareTypes':'types';state.items[c.id][target][cb.dataset.type]=cb.checked;render();save()});list.appendChild(el)});updateSummary()}
function updateSummary(){const baseTotal=categories.length*8;const rareCategories=categories.filter(c=>rareLabels[c.name]);const rareTotal=rareCategories.length*8;const total=baseTotal+rareTotal;const baseDone=categories.reduce((sum,c)=>sum+pikminTypes.filter(([id])=>state.items[c.id]?.types?.[id]).length,0);const rareDone=rareCategories.reduce((sum,c)=>sum+pikminTypes.filter(([id])=>state.items[c.id]?.rareTypes?.[id]).length,0);const done=baseDone+rareDone,pct=Math.round(done/total*100);const countGroup=group=>{const cs=categories.filter(c=>c.group===group);const groupRare=cs.filter(c=>rareLabels[c.name]);const d=cs.reduce((sum,c)=>sum+pikminTypes.filter(([id])=>state.items[c.id]?.types?.[id]).length,0)+groupRare.reduce((sum,c)=>sum+pikminTypes.filter(([id])=>state.items[c.id]?.rareTypes?.[id]).length,0);return`${d}/${cs.length*8+groupRare.length*8}`};doneCount.textContent=done;totalCount.textContent=total;percentText.textContent=pct+'%';progressBar.style.width=pct+'%';summaryText.textContent=done===total?'全部完成':`還剩 ${total-done} 隻`;regularCount.textContent=`(${countGroup('regular')})`;limitedCount.textContent=`(${countGroup('limited')})`;updatedAt.textContent=new Date(state.updatedAt).toLocaleString('zh-TW',{dateStyle:'medium',timeStyle:'short'})}
function showToast(){toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),1000)}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));render()});resetBtn.onclick=()=>{if(!confirm('確定要清除所有一般與稀有皮克敏勾選嗎？'))return;categories.forEach(c=>state.items[c.id]={types:blankTypes(),rareTypes:blankTypes()});render();save()};render();
</script>
</body></html>
