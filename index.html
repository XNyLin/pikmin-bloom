const key='pikmin-bloom-collection-v5';let activeTab='regular';let state=load();
function sid(s){return 'x-'+Array.from(s).map(c=>c.codePointAt(0).toString(16)).join('-')}
function blank(){const out={};categories.forEach(c=>c.series.forEach(s=>s.variants.forEach((_,i)=>out[sid(c.id+'|'+s.name+'|'+i)]=false)));return out}
function load(){try{const v=JSON.parse(localStorage.getItem(key));if(v?.checks)return v}catch(e){}const checks=blank();return{checks,updatedAt:Date.now()}}
function save(){state.updatedAt=Date.now();localStorage.setItem(key,JSON.stringify(state));updateSummary();showToast()}
function counts(c){let d=0,t=0;c.series.forEach(s=>s.variants.forEach((_,i)=>{t++;if(state.checks[sid(c.id+'|'+s.name+'|'+i)])d++}));return[d,t]}
function render(){list.innerHTML='';categories.filter(c=>c.group===activeTab).forEach(c=>{const [cd,ct]=counts(c);const el=document.createElement('article');el.className='category'+(cd===ct?' done':'');el.innerHTML=`<div class="head"><div><div class="label">${c.icon} ${c.name}</div><div class="muted">${c.series.length} 個裝飾系列</div></div><span class="badge">${cd===ct?'已完成':cd+'/'+ct}</span></div>${c.series.map(s=>{const vals=s.variants.map((name,i)=>({name,id:sid(c.id+'|'+s.name+'|'+i)}));const sd=vals.filter(v=>state.checks[v.id]).length;const rare=s.name.includes('稀有');return `<section class="series ${rare?'rare':''} ${sd===vals.length?'done':''}"><div class="series-head"><div class="series-name">${rare?'✨ ':''}${s.name}</div><span class="badge">${sd} / ${vals.length}</span></div><div class="grid">${vals.map(v=>`<div class="option"><input id="${v.id}" type="checkbox" ${state.checks[v.id]?'checked':''}><label for="${v.id}">${v.name}</label></div>`).join('')}</div><div class="mini-bar"><div style="width:${sd/vals.length*100}%"></div></div></section>`}).join('')}`;el.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{state.checks[cb.id]=cb.checked;render();save()});list.appendChild(el)});updateSummary()}
function groupCount(group){const cs=categories.filter(c=>c.group===group);let d=0,t=0;cs.forEach(c=>{const x=counts(c);d+=x[0];t+=x[1]});return `${d}/${t}`}
function updateSummary(){let done=0,total=0;categories.forEach(c=>{const x=counts(c);done+=x[0];total+=x[1]});const pct=total?Math.round(done/total*100):0;doneCount.textContent=done;totalCount.textContent=total;percentText.textContent=pct+'%';progressBar.style.width=pct+'%';summaryText.textContent=done===total?'全部完成':`還剩 ${total-done} 款`;regularCount.textContent=`(${groupCount('regular')})`;limitedCount.textContent=`(${groupCount('limited')})`;updatedAt.textContent=new Date(state.updatedAt).toLocaleString('zh-TW',{dateStyle:'medium',timeStyle:'short'})}
function showToast(){toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),900)}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));render()});
resetBtn.onclick=()=>{if(!confirm('確定要清除所有勾選嗎？'))return;state={checks:blank(),updatedAt:Date.now()};render();save()};render();
